# Тесты на каждое изменение в main и в запросах на слияние.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pyside6 pillow numpy

      - name: Программы для сжатия (кэш)
        uses: actions/cache@v4
        with:
          path: third_party/_downloads
          key: tools-${{ hashFiles('tools/fetch_tools.py') }}

      - name: Программы для сжатия
        run: python tools/fetch_tools.py
      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        # Упавшие тесты — ещё и аннотациями: их видно на странице прогона без входа на GitHub.
        run: |
          set -o pipefail
          python -X utf8 -m unittest discover -s tests -v 2>&1 | tee test.log || { python -X utf8 tests/ci_annotate.py test.log; exit 1; }
