# Тесты на каждое изменение в main и в запросах на слияние.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pyside6
      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
