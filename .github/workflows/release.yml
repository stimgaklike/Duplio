# Выпуск: при метке v1.2.3 GitHub на Windows прогоняет тесты, собирает программу и установщик
# и публикует релиз с Duplio-Setup-1.2.3.exe. Программа берёт обновления отсюда же.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Зависимости
        run: python -m pip install --upgrade pip pyside6 pyinstaller pillow numpy

      - name: Программы для сжатия (кэш)
        uses: actions/cache@v4
        with:
          path: third_party/_downloads
          key: tools-${{ hashFiles('tools/fetch_tools.py') }}

      - name: Программы для сжатия
        run: python tools/fetch_tools.py

      - name: Версия из метки
        shell: pwsh
        run: |
          # Только числовые версии вида v1.2.3: установщик и сравнение версий в программе понимают лишь такие.
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') { throw "Метка должна быть вида v1.2.3" }
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content version.py -Raw) -replace 'VERSION = "[^"]*"', "VERSION = `"$v`"" | Set-Content version.py -NoNewline
          Get-Content version.py

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        # Упавшие тесты — ещё и аннотациями: их видно на странице прогона без входа на GitHub.
        run: |
          set -o pipefail
          python -X utf8 -m unittest discover -s tests -v 2>&1 | tee test.log || { python -X utf8 tests/ci_annotate.py test.log; exit 1; }

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Сборка программы и установщика
        shell: cmd
        run: build.bat

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Duplio-Setup-*.exe
          generate_release_notes: true
